name: CI/CD Pipeline - FreshCart Recommender

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. TEST & MODEL EVALUATION JOB
  # ────────────────────────────────────────────────────────────────────────────
  test-and-evaluate:
    name: Run Unit Tests & Model SLA Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v

      - name: Run Model Invariant & Latency SLA Benchmark
        env:
          PYTHONPATH: .
        run: |
          python ml/evaluate.py

      - name: Upload Evaluation Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-report
          path: models/evaluation_report.json

  # ────────────────────────────────────────────────────────────────────────────
  # 2. DOCKER BUILD VERIFICATION JOB
  # ────────────────────────────────────────────────────────────────────────────
  docker-build-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test-and-evaluate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: freshcart-recommender:test

