services:
  # --- Backend REST Microservice (FastAPI + Uvicorn) ---
  backend:
    container_name: freshcart-backend
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:8501","http://127.0.0.1:8501","http://frontend:8501"]
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - freshcart-network

  # --- Frontend Web Dashboard (Streamlit) ---
  frontend:
    container_name: freshcart-frontend
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - freshcart-network

networks:
  freshcart-network:
    name: freshcart-network
    driver: bridge
